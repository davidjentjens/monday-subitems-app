name: Build and Deploy App to Monday.com

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
              - name: Checkout repository
                uses: actions/checkout@v4
        
              - name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                  node-version: '24.22.1'
        
              - name: Install dependencies
                run: npm ci
                env:
                  # apps-cli's patch-package postinstall hard-fails on CI for a
                  # patch that never applies; CI=false keeps it a warning.
                  CI: 'false'
        
              - name: Authenticate monday CLI
                run: npx mapps init -t "$MONDAY_API_TOKEN"
                env:
                  MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        
              - name: Run deploy script
                run: npm run deploy